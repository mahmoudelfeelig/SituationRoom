name: Deploy SituationRoom Production

on:
  workflow_run:
    workflows: ["SituationRoom CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: situationroom-production
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Bind deployment to the exact successful main CI run
        id: release
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          case "$CI_RUN_ID" in
            ""|*[!0-9]*) echo "CI run ID must contain decimal digits only." >&2; exit 64 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          case "$RELEASE_SHA" in
            *[!0-9a-f]*) echo "Release SHA must be lowercase hexadecimal." >&2; exit 64 ;;
          esac

          RUN_METADATA="$RUNNER_TEMP/situationroom-ci-run.json"
          MAIN_METADATA="$RUNNER_TEMP/situationroom-main-ref.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          jq --exit-status \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run_id "$CI_RUN_ID" \
            --arg sha "$RELEASE_SHA" \
            '(.id | tostring) == $run_id and
             .status == "completed" and
             .conclusion == "success" and
             .event == "push" and
             .head_branch == "main" and
             .head_sha == $sha and
             .repository.full_name == $repo and
             .head_repository.full_name == $repo and
             .name == "SituationRoom CI" and
             .path == ".github/workflows/ci.yml"' \
            "$RUN_METADATA" >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$MAIN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          CURRENT_MAIN_SHA=$(jq --exit-status --raw-output '.object.sha' "$MAIN_METADATA")
          test "$CURRENT_MAIN_SHA" = "$RELEASE_SHA"

          {
            printf 'ci_run_id=%s\n' "$CI_RUN_ID"
            printf 'release_sha=%s\n' "$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: situationroom-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/situationroom-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.ci_run_id }}
      - name: Verify the exact CI-tested release bundle
        shell: bash
        run: |
          cd "$RUNNER_TEMP/situationroom-release" || exit 1
          sha256sum --check SHA256SUMS
          sh -n deploy-release.sh
      - name: Configure the production SSH identity
        env:
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/situationroom_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/situationroom_deploy" "$HOME/.ssh/known_hosts"
      - name: Revalidate main before production mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        shell: bash
        run: |
          MAIN_METADATA="$RUNNER_TEMP/situationroom-main-before-deploy.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$MAIN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          CURRENT_MAIN_SHA=$(jq --exit-status --raw-output '.object.sha' "$MAIN_METADATA")
          test "$CURRENT_MAIN_SHA" = "$RELEASE_SHA"
      - name: Transfer and activate the tested release
        env:
          EXTERNAL_SMOKE_URL: ${{ vars.SITUATIONROOM_EXTERNAL_SMOKE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          SSH_PORT: ${{ vars.HETZNER_SSH_PORT }}
          SSH_USER: ${{ vars.HETZNER_USER }}
        shell: bash
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          SSH_PORT="${SSH_PORT:-22}"
          case "$SSH_PORT" in
            *[!0-9]*) echo "SSH port must contain decimal digits only." >&2; exit 64 ;;
          esac
          test "$EXTERNAL_SMOKE_URL" = "https://situationroom.elfeel.me"

          RELEASE_DIR="$RUNNER_TEMP/situationroom-release"
          REMOTE_DIR="/tmp/situationroom-release-$RELEASE_SHA"
          SSH=(
            ssh
            -i "$HOME/.ssh/situationroom_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -p "$SSH_PORT"
          )
          SCP=(
            scp
            -i "$HOME/.ssh/situationroom_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -P "$SSH_PORT"
          )

          # REMOTE_DIR is derived only from the validated lowercase 40-character release SHA.
          # shellcheck disable=SC2029
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "install -d -m 700 '$REMOTE_DIR'"
          "${SCP[@]}" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/deploy-release.sh" \
            "$RELEASE_DIR/situationroom-files.tar.gz" \
            "$RELEASE_DIR/situationroom-image.tar.gz" \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"

          FINAL_MAIN_METADATA="$RUNNER_TEMP/situationroom-main-before-activation.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$FINAL_MAIN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          FINAL_MAIN_SHA=$(jq --exit-status --raw-output '.object.sha' "$FINAL_MAIN_METADATA")
          test "$FINAL_MAIN_SHA" = "$RELEASE_SHA"

          # The remote path and arguments are fixed or validated above before client expansion.
          # shellcheck disable=SC2029
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" \
            "chmod 700 '$REMOTE_DIR/deploy-release.sh' && \
             '$REMOTE_DIR/deploy-release.sh' '$RELEASE_SHA' '$REMOTE_DIR' '$EXTERNAL_SMOKE_URL'"
